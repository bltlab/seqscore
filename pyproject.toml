[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seqscore"
dynamic = ["version"]
description = "SeqScore: Scoring for named entity recognition and other sequence labeling tasks"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Constantine Lignos", email = "lignos@brandeis.edu"},
]
requires-python = ">=3.10"
dependencies = [
    "attrs>=19.2.0",
    "click",
    "tabulate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/bltlab/seqscore"

[project.scripts]
seqscore = "seqscore.scripts.seqscore:cli"

[project.optional-dependencies]
dev = [
    "types-tabulate",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "mypy==2.1.0",
    "ruff==0.15.15",
    "flowmark",
]

[tool.setuptools.dynamic]
version = {attr = "seqscore.__version__"}

[tool.setuptools.packages.find]
include = ["seqscore", "seqscore.*"]

[tool.setuptools.package-data]
seqscore = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict_optional = false
disallow_untyped_defs = true
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = [
    "click.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py310"
