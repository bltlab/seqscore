[project]
name = "seqscore"
version = "0.7.0"
description = "SeqScore: Scoring for named entity recognition and other sequence labeling tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1.8",
  "pydantic>=2.11.7",
  "tabulate>=0.9.0",
  "seqscore-lib",
]
authors = [{ name = "Constantine Lignos", email = "lignos@brandeis.edu" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ner", "nlp", "conll", "scoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/bltlab/seqscore"
Documentation = "https://github.com/bltlab/seqscore/blob/main/README.md"
Repository = "https://github.com/bltlab/seqscore.git"
Issues = "https://github.com/bltlab/seqscore/issues"
Changelog = "https://github.com/bltlab/seqscore/releases"

[project.scripts]
seqscore = "seqscore:cli"

[tool.uv]
package = true

[tool.uv.sources]
seqscore-lib = { workspace = true }

[tool.uv.workspace]
members = ["packages/seqscore-lib"]

[tool.mypy]
python_version = "3.9"
strict_optional = false
disallow_untyped_defs = true
disallow_untyped_calls = true
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = ["setuptools", "click.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 90
target-version = "py39"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest==8.3.5",
  "pytest-cov==5.0.0",
  "ruff==0.9.10",
  "types-tabulate>=0.9.0.20241207",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
